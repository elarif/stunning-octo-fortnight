name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html styles.css manifest.webmanifest sw.js _site/
          cp -R js icons _site/
          touch _site/.nojekyll

      - name: Stamp build version
        run: |
          COMMIT="${GITHUB_SHA::7}"
          echo "Build commit: $COMMIT"
          printf "export const COMMIT = '%s';\n" "$COMMIT" > _site/js/version.js
          sed -i "s|const CACHE_NAME = 'gotfive-[^']*';|const CACHE_NAME = 'gotfive-${COMMIT}';|" _site/sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Wait for Pages artifact
        run: sleep 10

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
